<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add customer card</title>
</head>
<body>
<h2>Add Customer Card</h2>

<form th:action="@{/customer-card/add}" method="post" th:object="${customerCard}">
    <label>Card number:</label>
    <input type="text" th:field="*{cardNumber}">
    <br><br>

    <label>Surname:</label>
    <input type="text" th:field="*{custSurname}">
    <br><br>

    <label>Name:</label>
    <input type="text" th:field="*{custName}">
    <br><br>

    <label>Patronymic:</label>
    <input type="text" th:field="*{custPatronymic}">
    <br><br>

    <label>Phone number:</label>
    <input type="text" th:field="*{phoneNumber}">
    <br><br>

    <label>City:</label>
    <input type="text" th:field="*{city}">
    <br><br>

    <label>Street:</label>
    <input type="text" th:field="*{street}">
    <br><br>

    <label>ZIP code:</label>
    <input type="text" th:field="*{zipCode}">
    <br><br>

    <label>Percent:</label>
    <input type="number" th:field="*{percent}">
    <br><br>

    <button type="submit">Save</button>
</form>

<div th:if="${errors}">
    <p th:each="err : ${errors}" th:text="${err}"></p>
</div>

<a th:href="@{/customer-card}">Back</a>
</body>
</html>
