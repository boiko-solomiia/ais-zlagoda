<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>Edit store product</title>
</head>
<body class="store-products-page">

<div class="navigation-bar">
    <div class="navigation-links">
        <a href="/">Home</a>
        <a href="/product">Products</a>
        <a href="/store-product" class="active">Store Products</a>
        <a href="/category">Categories</a>
        <a href="/employee">Employees</a>
        <a href="/customer-card">Customer Cards</a>
        <a href="/check">Checks</a>
    </div>
    <div class="account-menu">
        <button class="account-btn">👤</button>
        <div class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button class="logout-btn" type="submit">Log Out</button>
            </form>
        </div>
    </div>
</div>

<div class="main-content">
    <div class="page-header">
        <h1>Edit Store Product</h1>
    </div>

    <div class="form-card">
        <form th:action="@{/store-product/edit}" method="post" th:object="${storeProduct}">

            <div class="form-field">
                <label class="form-label">UPC</label>
                <input type="text" th:field="*{upc}" class="form-control form-control-readonly" readonly>
            </div>

            <div class="form-field">
                <label class="form-label">Product</label>
                <div class="select-wrapper">
                    <select th:field="*{productId}" class="category-select form-control">
                        <option th:each="p : ${products}"
                                th:value="${p.productId}"
                                th:text="${p.productName}">
                        </option>
                    </select>
                    <span class="select-arrow">&#8964;</span>
                </div>
            </div>

            <div class="form-field">
                <label class="form-label">Selling price</label>
                <input type="number" step="0.01" th:field="*{sellingPrice}" class="form-control">
            </div>

            <div class="form-field">
                <label class="form-label">Quantity</label>
                <input type="number" th:field="*{productsNumber}" class="form-control" min="0">
            </div>

            <div class="form-field">
                <label class="form-label">Promotional product</label>
                <label class="checkbox-label">
                    <input type="checkbox" th:field="*{promotionalProduct}" class="form-checkbox">
                    <span>Mark as promotional</span>
                </label>
            </div>

            <div th:if="${errors}" class="errors-block">
                <p th:each="err : ${errors}" th:text="${err}"></p>
            </div>

            <div class="form-actions">
                <a th:href="@{/store-product}" class="btn btn-sort">Cancel</a>
                <button type="submit" class="btn btn-primary">Save changes</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
