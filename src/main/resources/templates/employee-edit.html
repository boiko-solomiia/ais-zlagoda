<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Edit employee</title>
  <meta charset="UTF-8">
</head>
<body>
<h2>Edit Employee</h2>

<form th:action="@{/employee/edit}" method="post" th:object="${employee}">
  <input type="hidden" th:field="*{idEmployee}">

  <label>Surname:</label>
  <input type="text" th:field="*{emplSurname}">
  <br><br>

  <label>Name:</label>
  <input type="text" th:field="*{emplName}">
  <br><br>

  <label>Patronymic:</label>
  <input type="text" th:field="*{emplPatronymic}">
  <br><br>

  <label>Role:</label>
  <select th:field="*{emplRole}">
    <option value="">-- Select role --</option>
    <option value="касир">Касир</option>
    <option value="менеджер">Менеджер</option>
  </select>
  <br><br>

  <label>Salary:</label>
  <input type="number" step="0.01" th:field="*{salary}">
  <br><br>

  <label>Date of Birth:</label>
  <input type="date" th:field="*{dateOfBirth}">
  <br><br>

  <label>Date of Start:</label>
  <input type="date" th:field="*{dateOfStart}">
  <br><br>

  <label>Phone Number:</label>
  <input type="tel" th:field="*{phoneNumber}" placeholder="+380501234567">
  <br><br>

  <label>City:</label>
  <input type="text" th:field="*{city}">
  <br><br>

  <label>Street:</label>
  <input type="text" th:field="*{street}">
  <br><br>

  <label>Zip Code:</label>
  <input type="text" th:field="*{zipCode}">
  <br><br>

  <button type="submit">Update</button>
</form>

<div th:if="${errors}">
  <p th:each="err : ${errors}" th:text="${err}"></p>
</div>

<a th:href="@{/employee}">Back to employees</a>
</body>
</html>
