<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>Categories</title>
</head>
<body class="categories-page">
<div class="navigation-bar">
    <div class="navigation-links">
        <a href="/">Home</a>
        <a href="/product">Products</a>
        <a href="/store-product">Store Products</a>
        <a sec:authorize="hasRole('MANAGER')" href="/category" class="active">Categories</a>
        <a sec:authorize="hasRole('MANAGER')" href="/employee">Employees</a>
        <a href="/customer-card">Customer Cards</a>
        <a href="/check">Checks</a>
    </div>

    <div class="account-menu">
        <button class="account-btn">👤</button>
        <div class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button class="logout-btn" type="submit">Log Out</button>
            </form>
        </div>
    </div>
</div>

<div class="main-content">
    <div class="page-header">
        <h1>Categories</h1>
    </div>

    <div class="action-bar">
        <div class="filters">
            <form th:action="@{/category/search}" method="get" class="search-form">
                <label>
                    <input type="text" name="name" th:value="${searchName}"
                           placeholder="Search by name" class="search-input">
                </label>
                <button type="submit" class="btn btn-secondary">Search</button>
                <a th:if="${searchName}" th:href="@{/category}" class="btn btn-sort">Clear</a>
            </form>
        </div>

        <div class="action-right">
            <a th:href="@{/category/add}" class="btn btn-primary">Add category</a>
            <a th:href="@{/category/print}" class="btn btn-sort">Print Report</a>
        </div>
    </div>

    <div class="active-filters">
        <span th:if="${searchName}" class="filter-badge">
            Search: <b th:text="${searchName}"></b>
            <a th:href="@{/category}" class="remove-filter">х</a>
        </span>
    </div>

    <div th:if="${errors != null and !#lists.isEmpty(errors)}" class="errors-block">
        <div th:each="err : ${errors}" th:text="${err}"></div>
    </div>

    <div th:if="${successMessage}" class="success-block">
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${categories == null or #lists.isEmpty(categories)}" class="empty-state">
        <p>No categories found.</p>
        <a th:href="@{/category/add}" class="btn btn-primary">Add category</a>
    </div>

    <div th:unless="${categories == null or #lists.isEmpty(categories)}" class="category-grid">
        <div th:each="cat : ${categories}" class="category-card">
            <span class="category-name" th:text="${cat.categoryName}"></span>
            <small class="category-number" th:text="${cat.categoryNumber}"></small>
            <div class="category-actions">
                <a th:href="@{/category/edit/{id}(id=${cat.categoryNumber})}" class="btn-edit">Edit</a>
                <form th:action="@{/category/delete/{id}(id=${cat.categoryNumber})}" method="post" class="inline-form">
                    <button type="submit" class="btn-delete" onclick="return confirm('Are you sure?')">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>
