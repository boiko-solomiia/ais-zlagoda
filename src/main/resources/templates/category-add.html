<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <title>Add category</title>
</head>
<body class="categories-page">

<div class="navigation-bar">
  <div class="navigation-links">
    <a href="/">Home</a>
    <a href="/product">Products</a>
    <a href="/store-product">Store Products</a>
    <a sec:authorize="hasRole('MANAGER')" href="/category" class="active">Categories</a>
    <a sec:authorize="hasRole('MANAGER')" href="/employee">Employees</a>
    <a href="/customer-card">Customer Cards</a>
    <a href="/check">Checks</a>
  </div>
  <div class="account-menu">
    <button class="account-btn">👤</button>
    <div class="dropdown-menu">
      <a href="/profile">My Profile</a>
      <form th:action="@{/logout}" method="post" style="margin: 0;">
        <button class="logout-btn" type="submit">Log Out</button>
      </form>
    </div>
  </div>
</div>

<div class="main-content">
  <div class="page-header">
    <h1>Add Category</h1>
  </div>

  <div class="form-card">
    <form th:action="@{/category/add}" method="post" th:object="${category}">

      <div class="form-field">
        <label class="form-label">Category name</label>
        <label>
          <input type="text" th:field="*{categoryName}" class="form-control"
                 placeholder="Enter category name">
        </label>
      </div>

      <div th:if="${errors}" class="errors-block">
        <p th:each="err : ${errors}" th:text="${err}"></p>
      </div>

      <div class="form-actions">
        <a th:href="@{/category}" class="btn btn-sort">Cancel</a>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
