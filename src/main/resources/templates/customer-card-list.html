<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>Customer cards</title>
</head>
<body class="customer-cards-page">
<div class="navigation-bar">
    <div class="navigation-links">
        <a href="/">Home</a>
        <a href="/product">Products</a>
        <a href="/store-product">Store Products</a>
        <a href="/category">Categories</a>
        <a href="/employee">Employees</a>
        <a href="/customer-card" class="active">Customer Cards</a>
        <a href="/check">Checks</a>
    </div>

    <div class="account-menu">
        <button class="account-btn">👤</button>
        <div class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button class="logout-btn" type="submit">Log Out</button>
            </form>
        </div>
    </div>
</div>
<h2>Customer Cards</h2>

<a th:href="@{/customer-card/add}">Add customer card</a>

<form th:action="@{/customer-card/search}" method="get">
    <input type="text" name="surname" placeholder="Search by surname">
    <button type="submit">Search</button>
</form>

<p th:if="${searchSurname}">
    Search results for surname: <b th:text="${searchSurname}"></b>
</p>

<p th:if="${selectedPercent}">
    Customer cards with percent: <b th:text="${selectedPercent}"></b>
</p>

<ul>
    <li th:each="card : ${customerCards}">
        <span th:text="${card.cardNumber}"></span>
        |
        <span th:text="${card.custSurname}"></span>
        <span th:text="${card.custName}"></span>
        <span th:text="${card.custPatronymic}"></span>
        |
        <span th:text="${card.phoneNumber}"></span>
        |
        <span th:text="${card.percent}"></span>%

        <a th:href="@{/customer-card/edit/{cardNumber}(cardNumber=${card.cardNumber})}">Edit</a>

        <form th:action="@{/customer-card/delete/{cardNumber}(cardNumber=${card.cardNumber})}" method="post" style="display:inline;">
            <button type="submit">Delete</button>
        </form>
    </li>
</ul>
</body>
</html>
