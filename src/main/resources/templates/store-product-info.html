<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>Store product info</title>
</head>
<body class="store-products-page">
<div class="navigation-bar">
    <div class="navigation-links">
        <a href="/home">Home</a>
        <a href="/product">Products</a>
        <a href="/store-product">Store Products</a>
        <a href="/category">Categories</a>
        <a href="/employee">Employees</a>
        <a href="/customer-card">Customer Cards</a>
        <a href="/check">Checks</a>
    </div>

    <div class="account-menu">
        <button class="account-btn">👤</button>
        <div class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button class="logout-btn" type="submit">Log Out</button>
            </form>
        </div>
    </div>
</div>

<div class="main-content">
    <div class="page-header">
        <h1>Store Product Info</h1>
    </div>

    <div th:if="${storeProductInfo == null}" class="empty-state">
        <p>No product found with UPC: <strong th:text="${searchUpc}"></strong></p>
        <a th:href="@{/store-product}" class="btn btn-primary" style="margin-top: 0.75rem;">Back to store products</a>
    </div>

    <div th:unless="${storeProductInfo == null}" class="info-card">
        <div class="info-row">
            <span class="info-label">Name</span>
            <span class="info-value" th:text="${storeProductInfo.productName}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Characteristics</span>
            <span class="info-value" th:text="${storeProductInfo.characteristics}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Selling price</span>
            <span class="info-value" th:text="${storeProductInfo.sellingPrice}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Quantity</span>
            <span class="info-value" th:text="${storeProductInfo.productsNumber}"></span>
        </div>
        <div>
            <a th:href="@{/store-product}" class="btn btn-primary">Back to store products</a>
        </div>
    </div>
</div>
</body>
</html>
