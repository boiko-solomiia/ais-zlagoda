<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>Store product info</title>
</head>
<body class="store-products-page">

<div class="navigation-bar">
    <div class="navigation-links">
        <a href="/">Home</a>
        <a href="/product">Products</a>
        <a href="/store-product" class="active">Store Products</a>
        <a sec:authorize="hasRole('MANAGER')" href="/category">Categories</a>
        <a sec:authorize="hasRole('MANAGER')" href="/employee">Employees</a>
        <a href="/customer-card">Customer Cards</a>
        <a href="/check">Checks</a>
    </div>
    <div class="account-menu">
        <button class="account-btn">👤</button>
        <div class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button class="logout-btn" type="submit">Log Out</button>
            </form>
        </div>
    </div>
</div>

<div class="main-content">
    <div class="page-header">
        <h1>Store Product Info</h1>
    </div>

    <div th:if="${storeProductInfo == null}" class="empty-state">
        <p>No product found with UPC: <strong th:text="${searchUpc}"></strong></p>
        <a th:href="@{/store-product}" class="btn btn-primary" style="margin-top: 0.75rem;">Back to list</a>
    </div>

    <div th:unless="${storeProductInfo == null}" class="info-card">
        <p class="card-name" th:text="${storeProductInfo.productName}"></p>
        <p class="card-chars" th:text="${storeProductInfo.characteristics}"></p>

        <div class="divider"></div>

        <div class="card-stats">
            <div class="stat-row">
                <span class="stat-label">Price</span>
                <span class="stat-value"
                      th:text="${#numbers.formatDecimal(storeProductInfo.sellingPrice, 1, 2) + ' грн'}"></span>
            </div>
            <div class="stat-row">
                <span class="stat-label">In stock</span>
                <span class="stat-value" th:text="${storeProductInfo.productsNumber + ' units'}"></span>
            </div>
        </div>

        <div class="divider"></div>

        <a th:href="@{/store-product}" class="btn back-btn">← Back to list</a>
    </div>
</div>
</body>
</html>
