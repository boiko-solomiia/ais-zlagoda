<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Edit category</title>
</head>
<body>
<h2>Edit Category</h2>

<form th:action="@{/category/edit}" method="post" th:object="${category}">
  <input type="hidden" th:field="*{categoryNumber}">

  <label>Name:</label>
  <input type="text" th:field="*{categoryName}">
  <button type="submit">Update</button>
</form>

<div th:if="${errors}">
  <p th:each="err : ${errors}" th:text="${err}"></p>
</div>
</body>
</html>
