<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>Add Check</title>
    <script th:src="@{/js/check-add.js}"></script>
</head>
<body class="checks-page">
<div class="navigation-bar">
    <div class="navigation-links">
        <a href="/">Home</a>
        <a href="/product">Products</a>
        <a href="/store-product">Store Products</a>
        <a sec:authorize="hasRole('MANAGER')" href="/category">Categories</a>
        <a sec:authorize="hasRole('MANAGER')" href="/employee">Employees</a>
        <a href="/customer-card">Customer Cards</a>
        <a href="/check" class="active">Checks</a>
    </div>
    <div class="account-menu">
        <button class="account-btn">👤</button>
        <div class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button class="logout-btn" type="submit">Log Out</button>
            </form>
        </div>
    </div>
</div>

<div class="main-content">
    <div class="page-header"><h1>Add Check</h1></div>
    <div class="form-card">
        <form th:action="@{/check/add-with-sales}" method="post" th:object="${check}" id="checkForm">
            <input type="hidden" th:field="*{sumTotal}"/>
            <input type="hidden" th:field="*{vat}"/>

            <div class="form-field">
                <label class="form-label">Check Number</label>
                <input type="text" th:field="*{checkNumber}" class="form-control" required>
            </div>

            <div class="form-field">
                <label class="form-label">Cashier</label>

                <input type="hidden" th:field="*{idEmployee}"/>

                <input type="text"
                       class="form-control form-control-readonly"
                       th:value="${employees != null and !#lists.isEmpty(employees) ? employees[0].emplSurname + ' ' + employees[0].emplName + ' (' + employees[0].idEmployee + ')' : ''}"
                       readonly>
            </div>

            <div class="form-field">
                <label class="form-label">Customer Card (optional)</label>
                <div class="select-wrapper">
                    <select th:field="*{cardNumber}" class="category-select form-control">
                        <option value="">No card</option>
                        <option th:each="card : ${customerCards}"
                                th:value="${card.cardNumber}"
                                th:text="${card.custSurname + ' ' + card.custName + ' (' + card.cardNumber + ')' + ' - ' + card.percent + '%' }"
                                th:data-percent="${card.percent}">
                        </option>
                    </select>
                    <span class="select-arrow">&#8964;</span>
                </div>
            </div>

            <div class="form-field">
                <label class="form-label">Print Date & Time</label>
                <input type="datetime-local" th:field="*{printDate}" class="form-control" required>
            </div>

            <div class="form-field">
                <label class="form-label">Products (Sales)</label>
                <table class="sales-table" id="salesTable">
                    <thead>
                    <tr>
                        <th>Product (UPC)</th>
                        <th>Quantity</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="salesRows">
                    <tr>
                        <td>
                            <div class="select-wrapper">
                                <select name="upc" class="category-select form-control product-select"
                                        style="min-width: 220px;" required>
                                    <option value="">Select product</option>
                                    <option th:each="p : ${products}"
                                            th:value="${p.upc}"
                                            th:text="${p.productName + ' (' + p.upc + ') - ' + p.sellingPrice + 'грн'}"
                                            th:data-stock="${p.productsNumber}"
                                            th:data-price="${p.sellingPrice}">
                                    </option>
                                </select>
                                <span class="select-arrow">&#8964;</span>
                            </div>
                            <span class="stock-info"></span>
                        </td>
                        <td><input type="number" name="quantity" class="form-control quantity-input" min="1" value="1"
                                   required></td>
                        <td>
                            <button type="button" class="remove-row-btn" onclick="removeRow(this)">✖</button>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div id="discountLine" style="margin-top: 0.5rem; text-align: right; font-weight: bold; color: var(--primary-dark); display: none;">
                    <span id="discountText"></span>
                </div>

                <button type="button" class="btn btn-secondary add-row-btn" onclick="addRow()">+ Add product</button>
            </div>

            <div th:if="${errors}" class="errors-block">
                <p th:each="err : ${errors}" th:text="${err}"></p>
            </div>

            <div class="form-actions">
                <a th:href="@{/check}" class="btn btn-sort">Cancel</a>
                <button type="submit" class="btn btn-primary">Create Check</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
