<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <title>Checks</title>
</head>
<body>
<div class="navigation-bar">
  <div class="navigation-links">
    <a href="/">Home</a>
    <a href="/product">Products</a>
    <a href="/store-product">Store Products</a>
    <a href="/category">Categories</a>
    <a href="/employee">Employees</a>
    <a href="/customer-card">Customer Cards</a>
    <a href="/check" class="active">Checks</a>
  </div>

  <div class="account-menu">
    <button class="account-btn">👤</button>
    <div class="dropdown-menu">
      <a href="/profile">My Profile</a>
      <form th:action="@{/logout}" method="post" style="margin: 0;">
        <button class="logout-btn" type="submit">Log Out</button>
      </form>
    </div>
  </div>
</div>
<h2>Checks</h2>

<a th:href="@{/check/add}">Add check</a>

<ul>
  <li th:each="ch : ${checks}">
    <span th:text="${ch.checkNumber}"></span>
    |
    employee:
    <span th:text="${ch.idEmployee}"></span>
    |
    card:
    <span th:text="${ch.cardNumber}"></span>
    |
    date:
    <span th:text="${#temporals.format(ch.printDate, 'yyyy-MM-dd HH:mm')}"></span>
    |
    total:
    <span th:text="${ch.sumTotal}"></span>
    |
    vat:
    <span th:text="${ch.vat}"></span>

    <a th:href="@{/check/edit/{checkNumber}(checkNumber=${ch.checkNumber})}">Edit</a>

    <form th:action="@{/check/delete/{checkNumber}(checkNumber=${ch.checkNumber})}" method="post" style="display:inline;">
      <button type="submit">Delete</button>
    </form>
  </li>
</ul>
</body>
</html>
