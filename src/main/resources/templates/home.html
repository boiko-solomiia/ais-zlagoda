<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>Zlagoda</title>
</head>
<body class="home-page">
<div class="navigation-bar">
    <div class="navigation-links">
        <a href="/" class="active">Home</a>
        <a href="/product">Products</a>
        <a href="/store-product">Store Products</a>
        <a href="/category">Categories</a>
        <a href="/employee">Employees</a>
        <a href="/customer-card">Customer Cards</a>
        <a href="/check">Checks</a>
    </div>

    <div class="account-menu">
        <button class="account-btn">👤</button>
        <div class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button class="logout-btn" type="submit">Log Out</button>
            </form>
        </div>
    </div>
</div>

<div class="center-content">
    <img class="logo" src="/images/zlagoda-logo.png" alt="Zlagoda Logo" th:src="@{/images/zlagoda-logo.png}">
</div>
</body>
</html>
